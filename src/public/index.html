<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoMonitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; padding: 1.5rem 2rem; background: #162330; border-bottom: 1px solid #1e3a4f; display: flex; align-items: center; gap: 0.75rem; }
    header h1 { font-size: 1.4rem; color: #00ed64; font-weight: 600; }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: #00ed64; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    main { width: 100%; max-width: 900px; padding: 2rem; }
    .card { background: #162330; border: 1px solid #1e3a4f; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 1rem; color: #8899a6; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; }
    .status-row .label { color: #8899a6; }
    .status-row .value { font-weight: 500; }
    .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; }
    .badge.ok { background: rgba(0,237,100,0.15); color: #00ed64; }
    .badge.err { background: rgba(255,80,80,0.15); color: #ff5050; }
    .cluster-list { list-style: none; }
    .cluster-list li { padding: 0.75rem 0; border-bottom: 1px solid #1e3a4f; display: flex; justify-content: space-between; align-items: center; }
    .cluster-list li:last-child { border-bottom: none; }
    .cluster-name { font-weight: 500; color: #ffffff; }
    .cluster-meta { font-size: 0.85rem; color: #8899a6; }
    .empty { color: #5c6d7e; font-style: italic; padding: 1rem 0; }
    .btn { background: #00ed64; color: #0f1923; border: none; padding: 0.5rem 1.25rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .btn:hover { background: #00c853; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.8rem; background: transparent; color: #ff5050; border: 1px solid #ff5050; }
    .btn-sm:hover { background: rgba(255,80,80,0.15); }
    .atlas-link { font-size: 0.8rem; color: #00ed64; text-decoration: none; margin-left: 0.5rem; padding: 0.15rem 0.5rem; border: 1px solid #00ed64; border-radius: 999px; }
    .atlas-link:hover { background: rgba(0,237,100,0.15); }
    form.add-cluster { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    form.add-cluster input { padding: 0.5rem 0.75rem; background: #0f1923; border: 1px solid #1e3a4f; border-radius: 6px; color: #e0e0e0; font-size: 0.9rem; }
    form.add-cluster input:focus { outline: none; border-color: #00ed64; }
    form.add-cluster input.full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header>
    <div class="dot" id="statusDot"></div>
    <h1>MongoMonitor</h1>
  </header>

  <main>
    <div class="card">
      <h2>Backend Status</h2>
      <div class="status-row">
        <span class="label">MongoDB</span>
        <span class="badge" id="mongoStatus">checking…</span>
      </div>
    </div>

    <div class="card">
      <h2>Monitored Clusters</h2>
      <form class="add-cluster" id="addForm">
        <input name="name" placeholder="Cluster name" required>
        <input name="region" placeholder="Region (optional)">
        <input name="uri" class="full" placeholder="Connection string (mongodb+srv://…)" required>
        <input name="atlasProjectId" placeholder="Atlas Project ID (optional)">
        <input name="atlasPublicKey" placeholder="Atlas Public API Key (optional)">
        <input name="atlasPrivateKey" class="full" placeholder="Atlas Private API Key (optional)" type="password">
        <div><button type="submit" class="btn">Add Cluster</button></div>
      </form>
      <ul class="cluster-list" id="clusterList">
        <li class="empty">Loading…</li>
      </ul>
    </div>
  </main>

  <script>
    const statusBadge = document.getElementById("mongoStatus");
    const statusDot = document.getElementById("statusDot");
    const clusterList = document.getElementById("clusterList");
    const addForm = document.getElementById("addForm");

    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (data.status === "ok") {
          statusBadge.textContent = "Connected";
          statusBadge.className = "badge ok";
          statusDot.style.background = "#00ed64";
        } else throw new Error();
      } catch {
        statusBadge.textContent = "Disconnected";
        statusBadge.className = "badge err";
        statusDot.style.background = "#ff5050";
      }
    }

    async function loadClusters() {
      try {
        const res = await fetch("/api/clusters");
        const clusters = await res.json();
        if (!clusters.length) {
          clusterList.innerHTML = '<li class="empty">No clusters registered yet.</li>';
          return;
        }
        clusterList.innerHTML = clusters.map(c => `
          <li>
            <div>
              <span class="cluster-name">${c.name}</span>
              <span class="cluster-meta"> — ${c.region}</span>
              ${c.atlasProjectId ? `<a class="atlas-link" href="https://cloud.mongodb.com/v2/${c.atlasProjectId}#/clusters/detail/${c.name}" target="_blank">Atlas Console</a>` : ""}
            </div>
            <button class="btn btn-sm" onclick="removeCluster('${c._id}')">Remove</button>
          </li>
        `).join("");
      } catch {
        clusterList.innerHTML = '<li class="empty">Failed to load clusters.</li>';
      }
    }

    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = new FormData(addForm);
      await fetch("/api/clusters", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: form.get("name"),
          uri: form.get("uri"),
          region: form.get("region"),
          atlasProjectId: form.get("atlasProjectId") || undefined,
          atlasPublicKey: form.get("atlasPublicKey") || undefined,
          atlasPrivateKey: form.get("atlasPrivateKey") || undefined,
        }),
      });
      addForm.reset();
      loadClusters();
    });

    async function removeCluster(id) {
      await fetch(`/api/clusters/${id}`, { method: "DELETE" });
      loadClusters();
    }

    checkHealth();
    loadClusters();
  </script>
</body>
</html>
